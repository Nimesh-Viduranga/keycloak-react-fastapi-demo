services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: brandvisual-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - brandvisual-keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: brandvisual-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: start-dev --http-port=8090 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: "8090"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8090"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8090"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

  # FastAPI BFF (internal only; browser reaches it via nginx)
  backend:
    build: ./backend
    container_name: brandvisual-backend
    env_file:
      - ./backend/.env
    environment:
      # Browser-facing Keycloak URL (token calls use extra_hosts → host gateway)
      KEYCLOAK_BASE_URL: http://localhost:8090
      KEYCLOAK_REALM: brandvisual
      KEYCLOAK_CLIENT_ID: react-fastapi-demo
      # KEYCLOAK_CLIENT_SECRET comes only from backend/.env (do not override here)
      PUBLIC_URL: http://localhost:8088
      FRONTEND_URL: http://localhost:8088
      BACKEND_URL: http://localhost:8088
      SESSION_SECRET: brandvisual-docker-session-secret
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - keycloak

  # Nginx: React static + reverse proxy /auth /api → backend (BrandVisual-style)
  nginx:
    build: ./frontend
    container_name: brandvisual-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  brandvisual-keycloak-db-data:
